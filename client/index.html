<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/attendx_app_icon.png" />
    <link rel="apple-touch-icon" href="/attendx_app_icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AttendX</title>
  </head>
  <body>
    <!-- Global Error Overlay -->
    <div id="global-error-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:99999; background:red; color:white; padding:20px; font-family:monospace; overflow:auto;">
      <h2>CRITICAL CRASH</h2>
      <pre id="global-error-msg" style="white-space:pre-wrap; word-wrap:break-word;"></pre>
      <button onclick="localStorage.clear(); window.location.reload();" style="margin-top:20px; padding:10px; background:white; color:red; border:none; border-radius:5px; font-weight:bold;">CLEAR CACHE & RELOAD</button>
    </div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.getElementById('global-error-overlay').style.display = 'block';
        document.getElementById('global-error-msg').innerText = message + '\n' + source + ':' + lineno + '\n\n' + (error ? error.stack : '');
      };
      window.onunhandledrejection = function(event) {
        document.getElementById('global-error-overlay').style.display = 'block';
        document.getElementById('global-error-msg').innerText = 'Unhandled Rejection:\n' + (event.reason ? (event.reason.stack || event.reason) : event);
      };
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
