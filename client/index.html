<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/attendx_app_icon.png" />
    <link rel="apple-touch-icon" href="/attendx_app_icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="AttendX - Smart Attendance Manager" />
    <title>AttendX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fonts for Neoclassical -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    <!-- Fonts for Aurora -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=Plus+Jakarta+Sans:wght@200;400;600&display=swap" rel="stylesheet">
    <!-- Fonts for Ethereal -->
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
    <!-- Fonts for Luxury Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Pinyon+Script&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
    
    <style>
      html, body {
        
        width: 100%;
        margin: 0;
        padding: 0;
      }
      
      /* Global Font Classes */
      .font-cinzel { font-family: 'Cinzel', serif; }
      .font-cormorant { font-family: 'Cormorant Garamond', serif; }
      .font-outfit { font-family: 'Outfit', sans-serif; }
      .font-jakarta { font-family: 'Plus Jakarta Sans', sans-serif; }
      .font-garamond { font-family: 'EB Garamond', serif; }
      .font-montserrat { font-family: 'Montserrat', sans-serif; }
      .font-playfair { font-family: 'Playfair Display', serif; }
      .font-pinyon { font-family: 'Pinyon Script', cursive; }
      
      /* Aurora Animations */
      @keyframes aurora-float1 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(30px, -50px) scale(1.1); }
      }
      @keyframes aurora-float2 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(-40px, 40px) scale(1.05); }
      }
      @keyframes aurora-float3 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(50px, 20px) scale(0.95); }
      }
      .animate-aurora-1 { animation: aurora-float1 15s ease-in-out infinite; }
      .animate-aurora-2 { animation: aurora-float2 18s ease-in-out infinite; }
      .animate-aurora-3 { animation: aurora-float3 20s ease-in-out infinite; }
    </style>
  </head>
  <body class=" w-full m-0 p-0 text-foreground bg-background">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
