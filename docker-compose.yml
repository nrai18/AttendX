version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: attendx
      POSTGRES_PASSWORD: attendx_password
      POSTGRES_DB: attendx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendx"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: postgres://attendx:attendx_password@postgres:5432/attendx
      AUTH_TYPE: plain
      AUTH_FILE: /etc/pgbouncer/userlist.txt
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./pgbouncer-userlist.txt:/etc/pgbouncer/userlist.txt:ro

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  server:
    build:
      context: ./server
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://attendx:attendx_password@postgres:5432/attendx?schema=public
      PORT: 3000
      JWT_SECRET: "your_jwt_secret_key"
      JWT_REFRESH_SECRET: "your_jwt_refresh_secret_key"
      FRONTEND_URL: "http://localhost:80"
      REDIS_URL: "redis://redis:6379"
      ML_API_URL: "http://ml-server:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  client:
    build:
      context: ./client
    ports:
      - "80:80"
    depends_on:
      - server

  ml-server:
    build:
      context: ./ml-server
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: postgres://attendx:attendx_password@postgres:5432/attendx
    depends_on:
      - redis
      - postgres
      - server

  celery:
    build:
      context: ./ml-server
    command: celery -A tasks.celery_app worker --loglevel=info
    environment:
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: postgres://attendx:attendx_password@postgres:5432/attendx
    depends_on:
      - redis
      - postgres
      - ml-server

volumes:
  postgres_data:
  redis_data:

